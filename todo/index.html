<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow, noarchive" />
<title>Follow-Up Tracker — Bryson Hunter</title>
<link rel="icon" type="image/png" href="../assets/logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,500&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#131110; --bg-2:#1b1815; --bg-3:#201a12;
    --ink:#e6dfd0; --ink-dim:#a89f8c; --ink-muted:#6d6555;
    --gold:#c9a45c; --gold-bright:#F2CD89;
    --line:rgba(201,164,92,0.18); --line-soft:rgba(230,223,208,0.08);
    --serif:'Cormorant Garamond','Times New Roman',serif;
    --sans:'Archivo',system-ui,sans-serif;
    --red:#e07a5f; --amber:#e0b95f; --green:#7ac491;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  html{scroll-behavior:smooth;}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6;min-height:100vh;}

  #gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
  .gate-card{width:100%;max-width:420px;background:var(--bg-2);border:1px solid var(--line);border-radius:16px;padding:48px 40px;text-align:center;}
  .gate-mark{width:44px;height:44px;margin:0 auto 20px;border:1px solid var(--line);border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--gold);font-family:var(--serif);font-size:20px;}
  .gate-card h1{font-family:var(--serif);font-weight:600;font-size:24px;color:var(--ink);margin-bottom:8px;}
  .gate-card p{color:var(--ink-dim);font-size:13px;margin-bottom:24px;}
  #gate-pw{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:14px 16px;color:var(--ink);font-family:var(--sans);font-size:15px;letter-spacing:1px;outline:none;}
  #gate-pw:focus{border-color:var(--gold);}
  #gate-btn{width:100%;margin-top:14px;background:linear-gradient(135deg,var(--gold),var(--gold-bright));border:none;border-radius:8px;padding:14px;color:#1a1408;font-weight:700;font-size:13px;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;}
  #gate-btn:hover{opacity:0.9;}
  #gate-err{color:var(--red);font-size:12px;margin-top:14px;min-height:16px;}
  #content{display:none;}

  header.top{padding:48px 24px 24px;text-align:center;border-bottom:1px solid var(--line-soft);}
  header.top .label{font-size:11px;letter-spacing:4px;text-transform:uppercase;color:var(--gold);font-weight:600;}
  header.top h1{font-family:var(--serif);font-weight:600;font-size:clamp(28px,5vw,42px);margin:10px 0 8px;}
  header.top p{color:var(--ink-dim);font-size:13.5px;max-width:560px;margin:0 auto;}
  #updated{color:var(--ink-muted);font-size:11.5px;margin-top:14px;letter-spacing:0.5px;}

  .wrap{max-width:920px;margin:0 auto;padding:32px 20px 80px;}

  .toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:28px;justify-content:center;}
  .filter-btn{background:var(--bg-2);border:1px solid var(--line);color:var(--ink-dim);padding:8px 16px;border-radius:100px;font-size:12px;letter-spacing:0.5px;cursor:pointer;transition:all .15s ease;}
  .filter-btn:hover, .filter-btn.active{border-color:var(--gold);color:var(--gold-bright);background:rgba(201,164,92,0.08);}

  .group{margin-bottom:36px;}
  .group h2{font-family:var(--serif);font-size:20px;font-weight:600;color:var(--gold-bright);margin-bottom:14px;padding-bottom:8px;border-bottom:1px solid var(--line);}

  .row{display:flex;gap:14px;align-items:flex-start;padding:14px 16px;border:1px solid var(--line-soft);border-radius:10px;background:var(--bg-2);margin-bottom:8px;transition:border-color .15s ease;}
  .row:hover{border-color:var(--line);}
  .row.status-done{opacity:0.45;}
  .row.status-dead{opacity:0.3;}

  .row .dot{width:8px;height:8px;border-radius:50%;margin-top:6px;flex-shrink:0;}
  .dot.high{background:var(--red);box-shadow:0 0 8px rgba(224,122,95,0.6);}
  .dot.medium{background:var(--amber);}
  .dot.low{background:var(--ink-muted);}

  .row .body{flex:1;min-width:0;}
  .row .name-line{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;}
  .row .name{font-family:var(--serif);font-weight:600;font-size:17px;color:var(--ink);}
  .badge{font-size:10px;letter-spacing:1px;text-transform:uppercase;padding:3px 8px;border-radius:100px;font-weight:600;}
  .badge.status-not_started{background:rgba(230,223,208,0.08);color:var(--ink-dim);}
  .badge.status-in_progress{background:rgba(224,185,95,0.12);color:var(--amber);}
  .badge.status-waiting{background:rgba(122,196,145,0.1);color:var(--green);}
  .badge.status-done{background:rgba(122,196,145,0.15);color:var(--green);}
  .badge.status-dead{background:rgba(230,223,208,0.06);color:var(--ink-muted);}
  .row .context{color:var(--ink-dim);font-size:13px;margin-top:4px;}
  .row .next{color:var(--gold-bright);font-size:12.5px;margin-top:6px;font-style:italic;}
  .row .next::before{content:"→ ";}

  .empty-note{text-align:center;color:var(--ink-muted);font-size:13px;padding:30px 0;}

  footer{text-align:center;padding:30px 20px;color:var(--ink-muted);font-size:11.5px;border-top:1px solid var(--line-soft);}
  footer a{color:var(--gold);text-decoration:none;}
</style>
</head>
<body>

<div id="gate">
  <div class="gate-card">
    <div class="gate-mark">B</div>
    <h1>Follow-Up Tracker</h1>
    <p>Private — enter password to continue</p>
    <input type="password" id="gate-pw" placeholder="Password" autocomplete="off" />
    <button id="gate-btn">Unlock</button>
    <div id="gate-err"></div>
  </div>
</div>

<div id="content">
  <header class="top">
    <div class="label">Private · Bryson Hunter</div>
    <h1>Who I'm Behind On</h1>
    <p>Every name here is currently unactioned or overdue. Nothing gets removed without a status change to Done or Dead.</p>
    <div id="updated">Last synced: —</div>
  </header>

  <div class="wrap">
    <div class="toolbar" id="toolbar">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="high">🔥 High Priority</button>
      <button class="filter-btn" data-filter="open">Open Only</button>
    </div>
    <div id="groups"></div>
  </div>

  <footer>
    Synced from Obsidian vault · <a href="/pages">Back to hub</a>
  </footer>
</div>

<script>
  const PASSWORD_HASH = "a52c2fe950a6bd472919552e5ccfaa491b8e9d115ee8af212d331aecca498039";
  const SESSION_KEY = "bh_todo_unlocked";

  async function sha256Hex(str){
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
  }
  function showContent(){
    document.getElementById('gate').style.display = 'none';
    document.getElementById('content').style.display = 'block';
    loadData();
  }
  function showGate(){
    document.getElementById('gate').style.display = 'flex';
    document.getElementById('content').style.display = 'none';
  }
  async function tryUnlock(){
    const val = document.getElementById('gate-pw').value;
    const hash = await sha256Hex(val);
    if (hash === PASSWORD_HASH){
      sessionStorage.setItem(SESSION_KEY, "1");
      document.getElementById('gate-err').textContent = "";
      showContent();
    } else {
      document.getElementById('gate-err').textContent = "Incorrect password.";
    }
  }
  document.getElementById('gate-btn').addEventListener('click', tryUnlock);
  document.getElementById('gate-pw').addEventListener('keydown', e => { if (e.key === 'Enter') tryUnlock(); });

  const STATUS_LABELS = {
    not_started: "Not Started",
    in_progress: "In Progress",
    waiting: "Waiting on Them",
    done: "Done",
    dead: "Dead"
  };

  let currentFilter = 'all';
  let allData = null;

  async function loadData(){
    try{
      const res = await fetch('./todo-data.json?_=' + Date.now());
      const data = await res.json();
      allData = data;
      document.getElementById('updated').textContent = 'Last synced: ' + (data.generated_at || 'unknown');
      render();
    } catch(e){
      document.getElementById('groups').innerHTML = '<div class="empty-note">Could not load tracker data.</div>';
    }
  }

  function render(){
    if (!allData) return;
    const container = document.getElementById('groups');
    container.innerHTML = '';
    allData.groups.forEach(group => {
      let people = group.people.filter(p => {
        if (currentFilter === 'high') return p.priority === 'high';
        if (currentFilter === 'open') return p.status !== 'done' && p.status !== 'dead';
        return true;
      });
      if (people.length === 0) return;
      const groupEl = document.createElement('div');
      groupEl.className = 'group';
      const h2 = document.createElement('h2');
      h2.textContent = group.name;
      groupEl.appendChild(h2);
      people.forEach(p => {
        const row = document.createElement('div');
        row.className = 'row status-' + p.status;
        row.innerHTML = `
          <div class="dot ${p.priority}"></div>
          <div class="body">
            <div class="name-line">
              <span class="name">${escapeHtml(p.name)}</span>
              <span class="badge status-${p.status}">${STATUS_LABELS[p.status] || p.status}</span>
            </div>
            ${p.context ? `<div class="context">${escapeHtml(p.context)}</div>` : ''}
            ${p.next_action ? `<div class="next">${escapeHtml(p.next_action)}</div>` : ''}
          </div>
        `;
        groupEl.appendChild(row);
      });
      container.appendChild(groupEl);
    });
    if (!container.innerHTML) {
      container.innerHTML = '<div class="empty-note">Nothing matches this filter.</div>';
    }
  }

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  document.getElementById('toolbar').addEventListener('click', e => {
    if (!e.target.classList.contains('filter-btn')) return;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    e.target.classList.add('active');
    currentFilter = e.target.dataset.filter;
    render();
  });

  if (sessionStorage.getItem(SESSION_KEY) === "1"){ showContent(); } else { showGate(); }
</script>

</body>
</html>
